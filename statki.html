  function drawMini(cv, board) {
    const ctx = cv.getContext('2d');
    const cp = 5, g = 1, S = 10;
    const total = S * cp + (S - 1) * g;
    cv.width = cv.height = total;
    ctx.clearRect(0, 0, total, total);

    for (let r = 0; r < S; r++) {
      for (let c = 0; c < S; c++) {
        const px = c * (cp + g), py = r * (cp + g);
        let color = '#0e4f73', key = r + ',' + c;
        let ship = null, shot = null;

        if (board.type === 'own') {
          const ships = mp.mode === '2v2' ? state22.myShips : state.playerShips;
          ship = shipAt(ships, r, c);
          const atks = mp.mode === '2v2'
            ? (state22.shots[state22.myId] || [])
            : state.enemyAttacks;
          shot = atks.find(a => a.r === r && a.c === c);
        } else if (board.type === 'ally') {
          ship = shipAt(state22.allyShips, r, c);
          const atks = state22.shots[state22.allyId] || [];
          shot = atks.find(a => a.r === r && a.c === c);
        } else if (mp.mode === '2v2' && (board.type === 'en1' || board.type === 'en2')) {
          const enIdx = board.type === 'en1' ? 0 : 1;
          const enId = state22.enIds[enIdx] || null;
          const shots = enId ? (state22.shots[enId] || []).filter(s => s.byTeam === state22.team) : [];
          const sunk = enId ? (state22.sunkCells[enId] || new Set()) : new Set();
          shot = shots.find(s => s.r === r && s.c === c);
          if (shot && sunk.has(key)) color = '#52212a';
          else if (shot && shot.hit) color = '#e63946';
          else if (shot) color = 'rgba(255,255,255,.25)';
          if (state22.phase === 'ended' && state22.reveal && !shot) {
            const rev = revealCells22(enId);
            if (rev.length && rev.some(p => p[0] === r && p[1] === c)) color = '#5a6b74';
          }
        } else {
          shot = state.enemyShots.find(s => s.r === r && s.c === c);
          ship = shipAt(state.enemyShips, r, c);
          if (shot) {
            const sunk = mp.mode === 'mp' ? mp.sunkCells.has(key) : !!(ship && ship.sunk());
            color = sunk ? '#52212a' : (shot.hit ? '#e63946' : 'rgba(255,255,255,.25)');
          }
          if (state.phase === 'ended' && ship && !shot) color = '#5a6b74';
        }

        if (board.type === 'own' || board.type === 'ally') {
          if (ship) color = '#7a8a94';
          if (shot) {
            if (shot.hit) {
              const sunkCheck = ship && ship.sunk();
              color = sunkCheck ? '#52212a' : '#e63946';
            } else {
              color = 'rgba(255,255,255,.25)';
            }
          }
        }

        ctx.fillStyle = color;
        ctx.fillRect(px, py, cp, cp);
      }
    }
  }


  // ================= KARUZELA (3-8 graczy) =================
  // n strzela w n+2, ostatni w pierwszego. Po eliminacji cele się przeliczają.
  const c = {
    phase: "lobby",      // lobby | placing | playing | ended
    myIdx: null,         // mój index w players[]
    players: [],         // [{id, name, alive}]
    myShips: [],
    allFleets: {},       // id -> ships[]
    allShots: {},        // id -> [{r,c,hit,byPlayer}]
    sunkCells: {},       // id -> Set("r,c")
    turnIdx: 0,          // indeks w aliveOrder
    aliveOrder: [],      // uporządkowana lista ID żywych graczy
    winner: null,
    boards: [],          // [{id, title, grid, active, target, isMe}] — dynamiczne
  };

  const hc = {
    conns: [], assigned: {}, names: {}, ready: {}, fleets: {}, shotHist: {},
    started: false, over: false,
  };

  function cReset() {
    c.phase = "lobby"; c.myIdx = null; c.players = []; c.myShips = [];
    c.allFleets = {}; c.allShots = {}; c.sunkCells = {}; c.turnIdx = 0;
    c.aliveOrder = []; c.winner = null; c.boards = [];
    hc.conns = []; hc.assigned = {}; hc.names = {}; hc.ready = {}; hc.fleets = {};
    hc.shotHist = {}; hc.started = false; hc.over = false;
  }

  function cHost() {
    if (mp.peer) leaveGame();
    cReset();
    mp.mode = "carousel";
    const id = genRoomId();
    mp.isHost = true; mp.role = "H";
    showRoomId(id, "Min 3, max 8 graczy. Podaj ID znajomym.");
    X(true);
    const peer = new Peer(id, peerOptions());
    mp.peer = peer;
    const me = { id: peer.id, name: nick(), alive: true };
    c.players = [me];
    hc.names[me.id] = me.name; hc.assigned[me.id] = true;

    peer.on("open", () => {
      dbg("Karuzela host:", peer.id);
      peer.on("connection", conn => {
        conn.on("data", msg => cHandleHostMsg(conn, msg));
        conn.on("close", () => {
          const p = c.players.find(p => p.id === conn.peer);
          if (p) { p.alive = false; cBroadcast({ type: "cPlayerLeft", id: p.id, name: p.name }); }
          hc.conns = hc.conns.filter(x => x !== conn);
        });
        conn.on("error", () => {});
      });
    });
  }

  async function cJoin() {
    const id = lanIdEl.value.trim();
    if (!id) { lanStatusEl.textContent = "Wpisz ID pokoju."; return; }
    if (mp.peer) leaveGame();
    cReset();
    mp.mode = "carousel"; mp.isHost = false;
    lanStatusEl.textContent = "Łączenie z Karuzelą " + id + "…";
    const peer = new Peer(peerOptions());
    mp.peer = peer;
    peer.on("open", () => {
      dbg("Karuzela guest:", peer.id); mp.role = peer.id;
      const conn = peer.connect(id);
      conn.on("open", () => {
        mp.conn = conn;
        conn.send({ type: "cJoin", id: peer.id, name: nick() });
        dbg("Dołączono do karuzeli, wysyłam cJoin");
      });
      conn.on("data", msg => cHandleGuestMsg(msg));
      conn.on("close", () => { lanStatusEl.textContent = "Rozłączono z karuzelą."; cReset(); X(false); });
    });
    peer.on("error", e => { dbg("peer err:", e.type); lanStatusEl.textContent = "Błąd: " + e.type; });
  }

  function cHandleHostMsg(conn, msg) {
    if (!msg || !msg.type) return;
    switch (msg.type) {
      case "cJoin":
        if (c.players.length >= 8) { conn.send({ type: "cError", text: "Karuzela pełna (max 8)." }); return; }
        if (hc.assigned[msg.id]) return;
        hc.assigned[msg.id] = true; hc.names[msg.id] = msg.name;
        c.players.push({ id: msg.id, name: msg.name, alive: true });
        hc.conns.push(conn);
        cBroadcast({ type: "cPlayers", players: c.players.map(p => ({ id: p.id, name: p.name, alive: p.alive })) });
        renderCarouselBoards();
        break;
      case "cPlace":
        hc.fleets[msg.id] = decodeShips(msg.fleet);
        cBroadcast({ type: "cFleet", id: msg.id, fleet: msg.fleet });
        break;
      case "cReady":
        hc.ready[msg.id] = true;
        cBroadcast({ type: "cReadyPlayer", id: msg.id });
        if (cAllReady()) { cStartGame(); }
        break;
      case "cShot":
        if (hc.over || !hc.started) return;
        const turnPlayer = c.aliveOrder[c.turnIdx];
        if (msg.id !== turnPlayer) return;
        const target = cTarget();
        if (!target) return;
        cProcessShot(msg.r, msg.c, msg.id, target);
        break;
    }
  }

  function cHandleGuestMsg(msg) {
    if (!msg || !msg.type) return;
    switch (msg.type) {
      case "cPlayers":
        c.players = msg.players.map(p => ({ ...p, alive: p.alive !== false }));
        renderCarouselBoards();
        break;
      case "cFleet":
        c.allFleets[msg.id] = decodeShips(msg.fleet);
        paintCarouselBoards();
        break;
      case "cReadyPlayer":
        const rp = c.players.find(p => p.id === msg.id); if (rp) rp.ready = true;
        cBroadcastReady();
        break;
      case "cStart":
        c.phase = "placing";
        c.players = msg.players.map(p => ({ ...p, alive: true, ready: false }));
        c.myIdx = c.players.findIndex(p => p.id === mp.role);
        c.allFleets = {}; c.allShots = {}; c.sunkCells = {};
        renderCarouselBoards();
        updatePalette();
        setStatus("Ustaw swoją flotę…");
        break;
      case "cBegin":
        c.phase = "playing";
        c.aliveOrder = msg.aliveOrder;
        c.turnIdx = msg.turnIdx;
        c.allFleets = {}; for (const [k, v] of Object.entries(msg.fleets)) c.allFleets[k] = decodeShips(v);
        c.myIdx = c.players.findIndex(p => p.id === mp.role);
        i.innerHTML = "<div class='subtitle' style='margin:0'>Flota ustawiona ✓</div>";
        s("btn-random").disabled = true; s("btn-rotate").disabled = true; s("btn-start").disabled = true;
        renderCarouselBoards();
        cUpdateTurn();
        paintCarouselBoards();
        break;
      case "cShotResult":
        cApplyResult(msg);
        break;
      case "cPlayerLeft":
        const lp = c.players.find(p => p.id === msg.id); if (lp) lp.alive = false;
        c.aliveOrder = c.aliveOrder.filter(x => x !== msg.id);
        c.turnIdx = c.turnIdx % Math.max(1, c.aliveOrder.length);
        renderCarouselBoards(); cUpdateTurn(); paintCarouselBoards();
        break;
      case "cEnd":
        c.phase = "ended"; c.winner = msg.winner;
        setStatus("Zwycięzca: " + (msg.winnerName || msg.winner) + " 🎉", "won");
        break;
      case "cError":
        lanStatusEl.textContent = msg.text || "Błąd karuzeli.";
        break;
    }
  }

  function cAllReady() {
    if (c.players.length < 3) return false;
    return c.players.every(p => hc.ready[p.id]);
  }

  function cBroadcast(msg) {
    for (const conn of hc.conns) { try { conn.send(msg); } catch {} }
    if (mp.peer && mp.peer.id) cHandleHostMsg(null, msg); // host też przetwarza
  }

  function cBroadcastReady() {
    const readyCount = c.players.filter(p => hc.ready[p.id]).length;
    lanStatusEl.textContent = "Gotowych: " + readyCount + "/" + c.players.length;
  }

  function cStartGame() {
    for (const p of c.players) if (!hc.fleets[p.id]) { cBroadcast({ type: "cError", text: p.name + " nie ustawił floty!" }); return; }
    cBroadcast({ type: "cStart", players: c.players.map(p => ({ id: p.id, name: p.name })) });
    c.phase = "placing";
    for (const p of c.players) {
      c.allFleets[p.id] = hc.fleets[p.id];
      c.allShots[p.id] = [];
      c.sunkCells[p.id] = new Set();
    }
    renderCarouselBoards();
    updatePalette();
    setStatus("Ustaw swoją flotę…");
    // czekamy na ready od wszystkich
    hc.ready = {}; // reset ready dla nowej rundy
    for (const id of Object.keys(hc.assigned)) hc.ready[id] = false;
  }

  function cBegin() {
    // host woła, gdy wszyscy ustawili floty gotowi
    if (!cAllReady()) return;
    hc.started = true;
    c.aliveOrder = c.players.map(p => p.id);
    c.turnIdx = 0;
    const fleets = {}; for (const [k, v] of Object.entries(hc.fleets)) fleets[k] = encodeShips(v);
    cBroadcast({
      type: "cBegin",
      aliveOrder: c.aliveOrder,
      turnIdx: c.turnIdx,
      fleets: fleets,
    });
    c.phase = "playing";
    for (const [k, v] of Object.entries(hc.fleets)) c.allFleets[k] = v;
    for (const p of c.players) { c.allShots[p.id] = []; c.sunkCells[p.id] = new Set(); }
    i.innerHTML = "<div class='subtitle' style='margin:0'>Flota ustawiona ✓</div>";
    s("btn-random").disabled = true; s("btn-rotate").disabled = true; s("btn-start").disabled = true;
    renderCarouselBoards();
    cUpdateTurn();
    paintCarouselBoards();
  }

  function cTarget() {
    const cnt = c.aliveOrder.length;
    if (cnt < 2) return null;
    const idx = c.turnIdx;
    if (cnt >= 2) {
      // n+2 modulo, dla 2 graczy wzajemnie
      const targetIdx = cnt === 2 ? (idx + 1) % 2 : (idx + 2) % cnt;
      return c.aliveOrder[targetIdx];
    }
    return c.aliveOrder[(idx + 1) % cnt];
  }

  function cProcessShot(r, c, shooterId, targetId) {
    const ships = hc.fleets[targetId];
    const sh = shipAt(ships, r, c);
    const hit = !!sh;
    const key = r + "," + c;
    if (!hc.shotHist[targetId]) hc.shotHist[targetId] = new Set();
    if (hc.shotHist[targetId].has(key)) return;
    hc.shotHist[targetId].add(key);

    let sunk = false, eliminated = false;
    if (hit) {
      sh.hit(r, c);
      if (sh.sunk()) {
        sunk = true;
        // sprawdź eliminację
        if (ships.every(s => s.sunk())) {
          eliminated = true;
          const p = c.players.find(p => p.id === targetId);
          if (p) p.alive = false;
          c.aliveOrder = c.aliveOrder.filter(x => x !== targetId);
          if (c.aliveOrder.length <= 1) {
            const winner = c.aliveOrder[0] || shooterId;
            hc.over = true;
            cBroadcast({ type: "cEnd", winner, winnerName: hc.names[winner] || winner });
            return;
          }
        }
      }
    }

    if (!hit) {
      c.turnIdx = (c.turnIdx + 1) % c.aliveOrder.length;
    }
    if (c.turnIdx >= c.aliveOrder.length) c.turnIdx = c.turnIdx % c.aliveOrder.length;

    const result = { type: "cShotResult", r, c, hit, sunk, eliminated, targetId, shooterId,
      turnIdx: c.turnIdx, turnPlayer: c.aliveOrder[c.turnIdx] };
    cBroadcast(result);
  }

  function cApplyResult(msg) {
    const { r, c, hit, sunk, eliminated, targetId, shooterId, turnIdx, turnPlayer } = msg;
    const key = r + "," + c;
    if (!c.allShots[targetId]) c.allShots[targetId] = [];
    c.allShots[targetId].push({ r, c, hit, byPlayer: shooterId });
    if (hit) u(); else m();
    if (sunk) {
      y();
      if (!c.sunkCells[targetId]) c.sunkCells[targetId] = new Set();
      const ships = c.allFleets[targetId] || [];
      for (const s of ships) if (s.sunk()) for (const cell of s.cells) c.sunkCells[targetId].add(cell.r + "," + cell.c);
    }
    if (eliminated) {
      const p = c.players.find(p => p.id === targetId); if (p) p.alive = false;
      c.aliveOrder = c.aliveOrder.filter(x => x !== targetId);
      renderCarouselBoards();
    }
    c.turnIdx = turnIdx;
    c.aliveOrder = c.aliveOrder; // keep in sync
    cUpdateTurn();
    paintCarouselBoards();
  }

  function cUpdateTurn() {
    const turnId = c.aliveOrder[c.turnIdx];
    for (const b of c.boards) {
      if (b.gridEl) {
        b.gridEl.classList.toggle("carousel-turn", b.id === turnId);
        b.gridEl.classList.toggle("carousel-target", b.id === cTarget());
        b.gridEl.classList.toggle("carousel-you", b.id === mp.role);
      }
    }
    const tp = c.players.find(p => p.id === turnId);
    const nm = tp ? (tp.name || tp.id) : "?";
    setStatus("Kolej: " + nm + (turnId === mp.role ? " (Twój ruch!)" : " — strzela w " + (c.players.find(p => p.id === cTarget())?.name || "?")));
  }

  function renderCarouselBoards() {
    const wrap = s("boardsCarousel");
    wrap.innerHTML = "";
    c.boards = [];
    for (const p of c.players) {
      if (!p.alive && c.phase === "playing") continue; // nie pokazuj wyeliminowanych w trakcie gry
      const bw = document.createElement("div");
      bw.className = "board-wrap";
      const t = document.createElement("div");
      t.className = "board-title";
      t.textContent = (p.name || p.id) + (p.id === mp.role ? " (Ty)" : "");
      bw.appendChild(t);
      const grid = document.createElement("div");
      grid.className = "grid";
      grid.id = "carousel-grid-" + p.id.slice(-6);
      bw.appendChild(grid);
      wrap.appendChild(bw);
      renderBoard(grid, false);
      // kliknięcia: placing = własna plansza, playing = plansza celu
      grid.addEventListener("click", e => {
        const cell = e.target.closest(".cell"); if (!cell) return;
        const r = +cell.dataset.r, cL = +cell.dataset.c;
        if (c.phase === "placing" && p.id === mp.role) {
          tryPlace(r, cL);
        } else if (c.phase === "playing") {
          const turnPlayer = c.aliveOrder[c.turnIdx];
          if (turnPlayer !== mp.role) return;
          const target = cTarget();
          if (p.id !== target) return;
          cShoot(r, cL, target);
        }
      });
      c.boards.push({ id: p.id, grid, title: t, gridEl: grid });
    }
    for (const conn of hc.conns) {
      if (c.phase === "placing" && hc.ready[conn.playerId]) {
        // show ready marker
      }
    }
    updatePalette();
    paintCarouselBoards();
  }

  function paintCarouselBoards() {
    for (const b of c.boards) {
      const ships = c.allFleets[b.id] || [];
      const shots = c.allShots[b.id] || [];
      const sunk = c.sunkCells[b.id] || new Set();
      const cells = b.gridEl.querySelectorAll(".cell");
      for (const cell of cells) {
        const r = +cell.dataset.r, cL = +cell.dataset.c;
        const key = r + "," + cL;
        const ship = shipAt(ships, r, cL);
        const shot = shots.find(s => s.r === r && s.c === cL);
        cell.className = "cell" + (ship ? " ship" : "");
        if (shot && shot.hit) {
          cell.classList.add(sunk.has(key) ? "sunk" : "hit");
        } else if (shot) {
          cell.classList.add("miss");
        }
      }
    }
    cUpdateTurn();
    updatePalette();
    drawMobMinis();
  }

  function cNewGame() {
    cReset();
    s("boardsCarousel").innerHTML = "";
    i.innerHTML = "";
    updatePalette();
    setStatus("Karuzela — utwórz lub dołącz do gry");
  }

  function cShoot(r, cL, targetId) {
    if (mp.isHost) {
      cProcessShot(r, cL, mp.peer.id, targetId);
    } else {
      mp.send({ type: "cShot", id: mp.role, r, c: cL });
    }
  }

  function encodeShips(ships) {
    return ships.map(s => ({ cells: s.cells.map(c => [c.r, c.c]), hits: [...s.hitSet] }));
  }

  function decodeShips(data) {
    return (data || []).map(s => {
      const cells = (s.cells || []).map(([r, c]) => ({ r, c }));
      const sh = makeShip(cells);
      for (const h of (s.hits || [])) sh.hitSet.add(h);
      return sh;
    });
  }


  // ---------- init ----------
  initDebug();
  initMob();
  // TURN Metered — auto-fetch credentiale z API (bezpieczny klucz tylko-do-odczytu)
  fetchMeteredTurn("st"+"atki.met"+"ered.live", "19790"+"aa61cee281e"+"55b77542865f2"+"20968ce");
  // ?metered=Domena:ApiKey nadpisuje domyslny klucz
  const mRaw = new URLSearchParams(location.search).get("metered");
  if (mRaw) { const ci = mRaw.indexOf(":"); if (ci > 0) fetchMeteredTurn(mRaw.slice(0, ci), mRaw.slice(ci + 1)); }
  bindPlacementBoard(playerGridEl);
  bindPlacementBoard(gridEls22.own);
  gridEls22.en1.addEventListener("click", e => shoot22(gridEls22.en1, e));
  gridEls22.en2.addEventListener("click", e => shoot22(gridEls22.en2, e));
  newGame();
})();
