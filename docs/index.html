<body>

<h1>Sta<span>tki</span></h1>
<div class="subtitle" id="subtitle">Gra w okręty &nbsp;•&nbsp; Ty vs. Komputer</div>

<div class="mode-switch">
  <button id="mode-sp" class="btn active">1 gracz (komputer)</button>
  <button id="mode-mp" class="btn">2 graczy online</button>
  <button id="mode-2v2" class="btn">2v2 drużynowo online</button>
</div>

<div id="lan-panel" class="lan-panel" hidden>
  <div class="lan-box">
    <span class="lan-sep">Nick:</span>
    <input id="nick-input" type="text" placeholder="Nick" autocomplete="off" spellcheck="false" value="Gracz">
    <button id="btn-host" class="btn">Utwórz grę</button>
    <span class="lan-sep">lub</span>
    <input id="lan-input" type="text" placeholder="Wklej ID pokoju" autocomplete="off" spellcheck="false">
    <button id="btn-join" class="btn">Dołącz</button>
    <button id="btn-leave" class="btn danger" hidden>Rozłącz</button>
  </div>
  <div class="slot-pick" id="slot-pick" hidden>
    <span class="lan-sep">Stanowisko (2v2):</span>
    <button class="btn slot-btn" data-slot="A2">A2 · Drużyna A</button>
    <button class="btn slot-btn" data-slot="B1">B1 · Drużyna B</button>
    <button class="btn slot-btn" data-slot="B2">B2 · Drużyna B</button>
  </div>
  <div class="lan-box">
    <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:#8fb4cc;font-size:.8rem">
      <input type="checkbox" id="lan-debug"> Debug (logi połączenia)
    </label>
  </div>
  <div id="lan-status"></div>
  <div id="lan-debug-out" style="color:#ffb86b;font-size:.8rem;min-height:1em"></div>
</div>

<div id="roster22" class="roster" hidden></div>

<div id="status"><span class="lamp"></span><span id="status-text">Ustaw swoją flotę…</span></div>

<div id="palette" class="ship-palette"></div>

<div id="mob-bar" hidden></div>
<div id="mob-minis" hidden></div>

<div class="boards" id="boards2">
  <div class="board-wrap player">
    <div class="board-title" id="player-title">Twoja flota</div>
    <div id="player-grid" class="grid"></div>
  </div>
  <div class="board-wrap enemy">
    <div class="board-title" id="enemy-title">Flota wroga</div>
    <div id="enemy-grid" class="grid"></div>
  </div>
</div>

<div class="boards" id="boards22" hidden>
  <div class="board-wrap">
    <div class="board-title" id="title-own">Twoja plansza</div>
    <div id="grid-own" class="grid"></div>
  </div>
  <div class="board-wrap">
    <div class="board-title" id="title-ally">Partner</div>
    <div id="grid-ally" class="grid"></div>
  </div>
  <div class="board-wrap">
    <div class="board-title" id="title-en1">Przeciwnik 1</div>
    <div id="grid-en1" class="grid"></div>
  </div>
  <div class="board-wrap">
    <div class="board-title" id="title-en2">Przeciwnik 2</div>
    <div id="grid-en2" class="grid"></div>
  </div>
</div>

<div class="controls">
  <button id="btn-random" class="btn">Losuj flotę</button>
  <button id="btn-rotate" class="btn">Obróć (R)</button>
  <button id="btn-start" class="btn primary">Start</button>
  <button id="btn-new" class="btn danger">Nowa gra</button>
</div>

<footer>Klikaj na siatkę, aby ustawić statki • <span class="kbd">R</span> — obrót • klikanie na pola wroga = strzał</footer>
